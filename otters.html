# Over otters

Otters zijn bijzondere zoogdieren die voornamelijk in en rondom het water leven. Er bestaan verschillende soorten otters over de hele wereld en kunnen behoorlijk van elkaar verschillen in grootte, uiterlijk en  de omgeving waarin ze leven. Hun gedrag is niet zo simpel als het lijkt. Achter veel van hun gewoontes zit een reden die voor ons juist grappig of schattig lijken, maar voor hun een belangrijke manier is voor bijvoorbeeld communicatie, bescherming of het leren van vaardigheden.

---
background-image: url(./waterachtergrond2.jpg)

# Kenmerken

Otters hebben een langgerekt, slank lichaam met korte poten. Tussen de tenen van hun poten zitten zwemvliezen waarmee ze snel en gemakkelijk door het water heen kunnen zwemmen. Ook hebben de dieren gevoelige tastbare ronde de snuit en op de ellebogen. De meeste soorten hebben klauwen aan hun poten, hiermee zoeken zij vooral naar prooidieren.

Otters kunnen een lichaam hebben van 60 - 90 cm lang. Daarbij kan hun staart de lengte hebben van 35 - 47 cm. Hiernaast kan je ze ook herkennen aan hun glanzende vacht, die grotendeels donkerbruin is waarvan de onderzijde licht gekleurd.
Ze hebben een brede, platte kop met grote en sterk ontwikkelde snorharen waarmee ze bewegingen van waterdieren kunnen traceren.

De buitenste vacht laag van de otter is waterdicht en de binnenste laag houdt lucht vast, zodat de huid niet nat wordt. Dit functioneert als een soort waterdicht pak. Hun staart werkt als een roer in het water, waarmee ze super snel van richting kunnen veranderen onder water. De snelheid van zwemmende otters in het water is tot 12 kilometer per uur, op land kunnen ze rennen tot wel 25 kilometer per uur ondanks hun korte poten.

---

# Leefwijze

Over het algemeen zijn otters vooral viseters met voornamelijk langzamere vissoorten zoals paling. Naast vis eten ze ook kikkers, kreeftachtigen en soms ook vogels en kleine zoogdieren. Otters hebben grote hoeveelheden voedsel nodig, omdat jagen en voortbewegen in het water hun veel energie kost.

Sommige otter soorten leven in groepen, maar de meeste otters leven graag alleen. Het zijn speelse dieren, die graag van modderoevers glijden, over elkaar heen springen en achter elkaar aan rennen of zwemmen. Zelfs de otters die het meest alleen leven spelen graag met soortgenoten. 

---
background-image: url(./waterachtergrond2.jpg)

# Leefomgeving

Otters komen voor op bijna elk continent, behalve in Australië en Antarctica. Ze leven in waterrijke gebieden met helder water, veel vis en dichte oeverbegroeiing om te schuilen. Watergebieden kunnen zijn rivieren, beken, meren, plassen, kanalen en moerassen. Ze kiezen juist voor beschutte plekken waar weinig menselijke verstoring is om te rusten.

De meeste otters leven het liefst in en rond zoet water. Echter is er 1 soort die juist de voorkeur heeft naar het zoute water, de zeeotter.

Overdag slapen otters in een hol onder boomwortels of in rietbedden. Ze verblijven in dichte bosjes of hoog riet vlakbij de waterkant. De leefomgeving is belangrijk voor de otter om genoeg te kunnen jagen voor vis. De aanwezigheid van een otter laat zien dat het water schoon en gezond is, dit zodat ze hier goed kunnen jagen en genoeg begroeiing hebben om te kunnen schuilen. 

---
background-image: url(./waterachtergrond2.jpg)

# Soorten otters

In totaal zijn er wereldwijd 13 soorten otters. De bekendste otter hiervan is de Europese otter, oftewel de visotter. Deze soort komt ook in Nederland voor. Andere soorten zijn bijvoorbeeld de zeeotter, reuze-otter en de dwergotter, die de kleinste otter soort is die er bestaat.

---
background-image: url(./waterachtergrond2.jpg)

# Gedrag en gewoontes

Otters zijn erg speels, ze glijden door modder, springen over elkaar heen en gaan elkaar achterna wat voor hun allemaal een spel is. Echter wanneer hun territorium in gevaar dreigt te komen, kunnen ze serieus vechten en blazen als een kat om indruk te maken.

---
background-image: url(./waterachtergrond2.jpg)

# Leuke weetjes over otters!

1. Zeeotters slapen samen met hun medesoort op hun rug in het water. Om niet weg te drijven houden ze elkaars voorpootje vast om dichtbij elkaar te drijven.

2. In Nederland zijn de Europese otters in het wild te vinden. Ze waren een tijdje verdwenen maar sinds 2002 worden ze weer in het wild teruggezet. Nu zwemmen ze weer rond in provincies als Overijssel, Friesland, Gelderland en Brabant.

3. Otters zijn gek op stenen. Zeeotters gebruiken stenen als gereedschap. Ze slaan er bijvoorbeeld schelpen mee open om eten uit te halen. Andere otters gebruiken stenen vooral om mee te spelen, en sommige otters kunnen zelfs jongleren.

4. Sommige otter soorten hebben een soort geheime zak onder hun oksel waarin ze hun eten en favoriete stenen verstoppen. Zo kunnen ze altijd hun snacks meenemen.
